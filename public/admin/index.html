<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Administração do Blog</title>
    <style>
      /* O toggle (switch) dos campos boolean do Decap CMS não deixa claro
         visualmente se está ligado ou desligado. Usamos o atributo
         aria-checked (esse o Decap define sempre corretamente) em vez das
         classes CSS internas, que mudam de nome a cada build. */
      button[role="switch"] {
        border: 2px solid #94a3b8 !important;
      }
      button[role="switch"][aria-checked="true"] {
        background-color: #16a34a !important;
        border-color: #16a34a !important;
      }
      button[role="switch"][aria-checked="false"] {
        background-color: #cbd5e1 !important;
      }
    </style>
  </head>

  <body>
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
